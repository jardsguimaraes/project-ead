server:
    port: 8082
    servlet:
        context-path: "/ead-course/"

ead:
    api:
        url:
            authuser: "http://ead-authuser-service/ead-authuser"
    broker:
        exchange:
            userEventExchange: ead.userevent
        queue:
            userEventQueue:
                name: ead.userevent.ms.course

spring:
    application:
        name: ead-course-service
    datasource:
        url: jdbc:postgresql://localhost:5432/ead_course_v2
        username: postgres
        password: adm10092007
        driver-class-name: org.postgresql.Driver
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                "[format_sql]": true # aspas simples resolvem o aviso
                "[jdbc.lob.non_contextual_creation]": true
    rabbitmq:
        addresses: "amqps://zwthbyef:xVCBtrtStznDTNx7LMqhuRUf6jCzuvhS@chameleon.lmq.clo\
            udamqp.com/zwthbyef"
    jackson:
        serialization:
            "[INDENT_OUTPUT]": true

logging:
    level:
        root: INFO
        "[com.ead.course]": TRACE
        "[org.springframework.web]": DEBUG
        "[org.hibernate]": INFO

eureka:
    client:
        service-url:
            defaultZone: "http://localhost:8761/eureka/"
    instance:
        hostname: localhost
