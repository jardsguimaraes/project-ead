info:
  name: GET ALL USERS BY COURSE
  type: http

http:
  method: GET
  url: "{{localhost-gateway}}/ead-course/courses/64e3767d-a53f-4418-b612-c3fb18872a5b/users?sort=creationDate, DESC&page=0&size=1"
  params:
    - name: sort
      value: creationDate, DESC
      type: query
    - name: page
      value: "0"
      type: query
    - name: size
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
