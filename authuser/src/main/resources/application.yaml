server:
    port: 8087
    servlet:
        context-path: "/ead-authuser/"

spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/ead_authuser
        username: postgres
        password: adm10092007
        driver-class-name: org.postgresql.Driver
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                "[format_sql]": true # aspas simples resolvem o aviso
                "[jdbc.lob.non_contextual_creation]": true
    jackson:
        serialization:
            "[INDENT_OUTPUT]": true
    # output:   --Configuração para colorir os logs no console no Windows
    #     ansi:
    #         enabled: ALWAYS

ead:
    api:
        url:
            course: "http://localhost:8082/ead-course"

logging:
    level:
        root: INFO
        "[com.ead.authuser]": TRACE
        "[org.springframework.web]": DEBUG
        "[org.hibernate]": INFO
